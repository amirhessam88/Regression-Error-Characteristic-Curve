# More details on how to update this config file: https://mypy.readthedocs.io/en/stable/config_file.html

[mypy]

# -- types ---
check_untyped_defs = True
disallow_any_generics = True
disallow_incomplete_defs = True
disallow_untyped_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_configs = True

# --- errors ---
ignore_errors = False

# --- imports ----
ignore_missing_imports = True
namespace_packages = True
# src-layout package bases (see mypy_path below)
explicit_package_bases = True
mypy_path = src
files = src/rec,tests
# follow_imports options: normal, silent, skip and error
follow_imports = normal
follow_imports_for_stubs = True
no_site_packages = True

# --- platform ---
# Use 3.13 for stub parsing (align with current default runtime).
# Runtime support is >=3.10 via requires-python.
python_version = 3.13
platform = darwin

# --- strictness ---
strict = False
show_traceback = True
raise_exceptions = True

# --- error messages ---
color_output = True
error_summary = True
pretty = True
show_column_numbers = True
show_error_codes = True
show_absolute_path = False

# --- excludes ---
exclude = (?x)(^\.venv/|^build/|^dist/|^\.tox/)
