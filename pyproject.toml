[project]
name = "rec"
version = "2.0.0"
description = "Regression Error Characteristics Curve in Python"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Amirhessam Tahmassebi", email = "admin@amirhessam.com" },
]
maintainers = [
    { name = "Amirhessam Tahmassebi", email = "admin@amirhessam.com" },
]
requires-python = ">=3.10"
keywords = [
    "python",
    "data-science",
    "machine-learning",
    "regression",
    "rec-curve",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # --- scientific-computing ---
    "numpy>=1.23",
    "pandas>=1.4",
    "scipy>=1.10",
    # --- visualization ---
    "matplotlib>=3.5",
    "seaborn>=0.11",
]

[project.optional-dependencies]
dev = [
    "assertpy>=1.1",
    "mypy>=1.8",
    "pandas-stubs>=1.5",
    "poethepoet>=0.32",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "tox>=4.22",
    "tox-uv>=1.25",
]

[project.urls]
Homepage = "https://www.slickml.com"
Repository = "https://github.com/amirhessam88/Regression-Error-Characteristic-Curve"
Documentation = "https://www.docs.slickml.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rec"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/assets",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = ["/.gitignore"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "assertpy>=1.1",
    "mypy>=1.8",
    "pandas-stubs>=1.5",
    "poethepoet>=0.32",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "tox>=4.22",
    "tox-uv>=1.25",
]


# -- try `poe --help` for options
[tool.poe.tasks]

[tool.poe.tasks.greet]
help = "Runtime user greetings"
cmd = """
echo "Welcome to REC ♡♡♡ $USER ♡♡♡ ...\n\n\
██████╗ ███████╗ ██████╗
██╔══██╗██╔════╝██╔════╝
██████╔╝█████╗  ██║
██╔══██╗██╔══╝  ██║
██║  ██║███████╗╚██████╗
╚═╝  ╚═╝╚══════╝ ╚═════╝\
" """

[tool.poe.tasks.clean]
help = "Remove ignored caches, coverage, and build artifacts"
cmd = """
    rm -rf .coverage
           .coverage.*
           dist/
           build/
           .mypy_cache/
           .pytest_cache/
           .ruff_cache/
           .tox/
           htmlcov/
           xmlcov/
           **/__pycache__/
           **/.ipynb_checkpoints/
    """

[tool.poe.tasks.mypy]
help = "Lint types via mypy"
cmd = "mypy"

[tool.poe.tasks.format]
help = "Format code via ruff"
cmd = "ruff format ."

[tool.poe.tasks.check]
help = "Check all linting steps."
sequence = [
    "greet",
    { cmd = "poe format --check" },
    { cmd = "ruff check ." },
    { cmd = "poe mypy" },
]

[tool.poe.tasks.test]
help = "Run unit-tests via pytest"
cmd = """
    python -m pytest
        --cov=rec
        --cov-report=term-missing
        --cov-report=html
        --cov-report=xml
        --cov-config=.coveragerc
        --tb=short
        -ra
        -v
    """

[tool.poe.tasks.tox]
help = "Run check + test + build across Python versions via tox"
cmd = "tox"

[tool.poe.tasks.build]
help = "Build sdist and wheel via uv"
cmd = "uv build"
